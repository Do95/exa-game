# PostgreSQL for every environment.
# On your computer it connects to a local PostgreSQL server. Change the user, password,
# host or port with the environment variables below, or set DATABASE_URL.
# On Heroku, DATABASE_URL is set automatically by the Heroku Postgres add-on.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST") { "localhost" } %>
  port: <%= ENV.fetch("PGPORT") { 5432 } %>
  username: <%= ENV.fetch("PGUSER") { "postgres" } %>
  password: <%= ENV["PGPASSWORD"] %>

development:
  <<: *default
  database: flashback_development

test:
  <<: *default
  database: flashback_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
